version: 1
min_score: 75
block_on_critical: true
exclude:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/.git/**"
  - "**/*.min.js"
  - "**/*.bundle.js"
  - "**/coverage/**"
rules:
  sql-injection: error
  path-traversal: error
  auth-leak: error
  command-injection: error
  ssrf: error
  insecure-regex: warn
  cors-csrf: warn
framework: vitest
custom_secrets:
  - name: no_test_eval
    pattern: \beval\s*\(
    severity: high
